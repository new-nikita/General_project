<div class="comment-form-container mt-3 mb-4" id="comment-form-{{ post_id }}" style="display: none;">
    <form class="comment-form" method="post" action="/posts/{{ post_id }}/comments" enctype="multipart/form-data">
        <div class="mb-2">
            <textarea class="form-control comment-textarea" name="content" rows="2"
                      placeholder="Напишите комментарий..." required></textarea>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <div class="comment-actions">
                <label class="comment-image-btn btn btn-sm btn-outline-secondary me-2">
                    <i class="fas fa-image"></i>
                    <input type="file" name="image" accept="image/*" class="d-none">
                </label>
                <button type="button" class="btn btn-sm btn-outline-secondary emoji-btn">
                    <i class="far fa-smile"></i>
                </button>
            </div>
            <div>
                <button type="button" class="btn btn-outline-secondary btn-sm cancel-comment-btn me-2"
                        data-post-id="{{ post_id }}">
                    Отмена
                </button>
                <button type="submit" class="btn btn-primary btn-sm comment-submit-btn">
                    <i class="fas fa-paper-plane me-1"></i> Отправить
                </button>
            </div>
        </div>
    </form>
</div>
