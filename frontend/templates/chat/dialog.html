{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <div id="chat-box" class="chat-box"></div>

    <form id="chat-form" class="chat-form">
        <input type="text" id="message-input" placeholder="Введите сообщение..." required>
        <button type="submit">Отправить</button>
    </form>
</div>
{% endblock %}

{% block extra_css %}
<style>
.chat-container {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    height: 80vh;
}

.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #f1f1f1;
    border-radius: 10px;
}

.message {
    max-width: 70%;
    padding: 10px 15px;
    margin-bottom: 10px;
    border-radius: 20px;
    word-wrap: break-word;
}

.self {
    background: #4a76a8;
    color: white;
    margin-left: auto;
}

.other {
    background: white;
    border: 1px solid #ddd;
}

.chat-form {
    display: flex;
    margin-top: 10px;
}

.chat-form input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
}

.chat-form button {
    margin-left: 10px;
    padding: 10px 20px;
    border-radius: 20px;
    border: none;
    background: #4a76a8;
    color: white;
}
</style>
{% endblock %}

{% block extra_js %}
<script>
const companionId = "{{ companion_id }}";
const socket = new WebSocket(`ws://${window.location.host}/ws/chat/dialog/${companionId}`);

const chatBox = document.getElementById("chat-box");
const form = document.getElementById("chat-form");
const input = document.getElementById("message-input");

socket.onmessage = function(event) {
    const data = JSON.parse(event.data);

    const messageDiv = document.createElement("div");
    messageDiv.classList.add("message");

    if (data.is_self) {
        messageDiv.classList.add("self");
    } else {
        messageDiv.classList.add("other");
    }

    messageDiv.innerText = data.text;

    chatBox.appendChild(messageDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
};

form.addEventListener("submit", function(e) {
    e.preventDefault();

    socket.send(JSON.stringify({
        text: input.value
    }));

    input.value = "";
});
</script>
{% endblock %}
