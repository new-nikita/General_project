services:
  pg:
    image: postgres:17
    container_name: gp_pg
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d database"]
      interval: 5s
      timeout: 3s
      retries: 20

#  pg_test:
#    image: postgres:17
#    environment:
#      POSTGRES_DB: test_database
#      POSTGRES_USER: test_admin
#      POSTGRES_PASSWORD: test_password
#      PGDATA: /var/lib/postgresql/data
#    ports:
#      - "5434:5432"
#    volumes:
#      - pgdata_test:/var/lib/postgresql/data

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data:z
      - ./backend/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server --appendonly yes

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gp_backend
    env_file:
      - .env
    environment:
      APP_CONFIG__DB__URL: postgresql+asyncpg://admin:password@pg:5432/database
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      pg:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management  #
    ports:
      - "5672:5672"
      - "15672:15672"  # UI доступен по localhost:15672  порт для подключения веб интерфейса
    environment:
      RABBITMQ_DEFAULT_USER: guest  # значение по умолчанию
      RABBITMQ_DEFAULT_PASS: guest  # значение по умолчанию

volumes:
  pgdata:
